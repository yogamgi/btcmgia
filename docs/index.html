  <script>
  /** Promise wrapper around google.script.run. */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e : new Error(String(e)));
      });
      r[fn].apply(r, args);
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /**
   * Reads a file as { name, mimeType, data(base64) }. Photos are shrunk to `maxDim` px on the long side
   * and re-encoded as JPEG so uploads stay small on phone connections; other files are sent as-is (max 10 MB).
   */
  function readFile(file, maxDim) {
    var isPhoto = /^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type);
    return new Promise(function (resolve, reject) {
      if (!isPhoto && file.size > 10 * 1024 * 1024) return reject(new Error('File "' + file.name + '" lebih dari 10 MB.'));
      var r = new FileReader();
      r.onerror = function () { reject(new Error('Gagal membaca file "' + file.name + '".')); };
      r.onload = function () {
        var raw = { name: file.name, mimeType: file.type || 'application/octet-stream', data: String(r.result).split(',')[1] };
        if (!isPhoto) return resolve(raw);
        var img = new Image();
        img.onerror = function () {
          if (file.size > 10 * 1024 * 1024) reject(new Error('File "' + file.name + '" lebih dari 10 MB.'));
          else resolve(raw); // format the browser cannot draw (e.g. HEIC on some devices): send original
        };
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function fmtPct(v) { return v == null ? '–' : (Math.round(v) + '%'); }
  function fmtNum(v) { return v == null ? '–' : (Math.round(v * 10) / 10).toLocaleString('id-ID'); }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }

  /**
   * Tab bar: clicking a [data-tab] button shows the matching [data-panel]. Panels belong to the bar whose
   * data-group matches theirs, so tab bars can be nested (no data-group = the page's main tabs).
   */
  function setTabs(root, onChange) {
    var group = root.getAttribute('data-group') || '';
    var buttons = root.querySelectorAll('[data-tab]');
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        buttons.forEach(function (x) { x.classList.toggle('active', x === b); });
        document.querySelectorAll('[data-panel]').forEach(function (p) {
          if ((p.getAttribute('data-group') || '') !== group) return;
          p.classList.toggle('hidden', p.getAttribute('data-panel') !== b.getAttribute('data-tab'));
        });
        if (onChange) onChange(b.getAttribute('data-tab'));
      });
    });
  }

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  /**
   * Renders the dashboard into `el`. Shared by the Guest page and the Dev preview.
   * state.selected: student id or '' for all.
   */
  var charts = {};
  function renderDashboard(el, d, state) {
    var cats = d.categories;
    var sel = state.selected || '';
    var students = d.students;
    var selStudent = students.filter(function (s) { return s.id === sel; })[0] || null;
    var focus = selStudent ? { totalDone: selStudent.totalDone, totalTarget: selStudent.totalTarget, pct: selStudent.pct,
      done: selStudent.done, target: selStudent.target, ach: selStudent.ach } : d.totals;

    var html = '';
    if (d.notice) html += '<div class="notice info">' + esc(d.notice) + '</div>';
    html += '<div class="grid kpis" style="margin-bottom:16px">';
    html += kpi('Hari berjalan', d.day + ' / ' + d.durationDays, 'Mulai ' + esc(d.startDate || '-'));
    html += kpi(selStudent ? 'Unit selesai' : 'Total unit selesai', fmtNum(focus.totalDone), 'Target ' + fmtNum(focus.totalTarget));
    html += kpi('Capaian', fmtPct(focus.pct), selStudent ? esc(selStudent.name) : 'Semua santri');
    if (d.expectedToday != null) {
      html += selStudent
        ? kpi('Target milestone hari ini', fmtNum(d.expectedToday), statusPill(selStudent.status))
        : kpi('Sesuai target', d.totals.onTrack + ' / ' + students.length, d.totals.behind + ' santri di bawah target hari ini (' + fmtNum(d.expectedToday) + ' unit)');
    }
    cats.forEach(function (c) {
      html += kpi(esc(c.label), fmtNum(focus.done[c.key]) + ' / ' + fmtNum(focus.target[c.key]), fmtPct(focus.ach[c.key]));
    });
    html += '</div>';

    html += '<div class="card"><div class="chips">';
    html += '<button class="chip' + (sel ? '' : ' active') + '" data-student="">Semua</button>';
    students.forEach(function (s) {
      html += '<button class="chip' + (sel === s.id ? ' active' : '') + '" data-student="' + esc(s.id) + '">' +
        esc(s.nickname || s.name.split(' ')[0]) + '</button>';
    });
    html += '</div>';
    html += selStudent ? studentReportsHtml(selStudent) : studentTableHtml(students, cats);
    html += '</div>';

    html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">';
    html += '<div class="card"><h2>Progres kumulatif ' + (selStudent ? '– ' + esc(selStudent.name) : '(rata-rata santri)') +
      '</h2><div class="chart-box"><canvas id="chartLine"></canvas></div></div>';
    if (!selStudent) html += '<div class="card"><h2>Unit selesai per santri</h2><div class="chart-box"><canvas id="chartBar"></canvas></div></div>';
    html += '</div>';

    html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">';
    html += '<div class="card"><h2>Milestone target</h2><div class="table-wrap"><table><thead><tr><th>Hari ke</th><th class="num">Jml Unit</th></tr></thead><tbody>';
    d.milestones.forEach(function (m) {
      html += '<tr' + (d.day >= m.day ? ' class="selected"' : '') + '><td>' + m.day + '</td><td class="num">' + fmtNum(m.units) + '</td></tr>';
    });
    if (!d.milestones.length) html += '<tr><td colspan="2" class="muted">Belum ada milestone.</td></tr>';
    html += '</tbody></table></div></div>';
    if (d.showRecent && !selStudent) {
      var rec = d.recent.filter(function (r) { return !sel || r.studentId === sel; }).slice(0, 15);
      html += '<div class="card"><h2>Laporan terbaru</h2><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Perangkat</th><th class="num">Unit</th></tr></thead><tbody>';
      rec.forEach(function (r) {
        html += '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.studentName) + '</td><td>' + esc(r.category) + '</td><td class="num">' + fmtNum(r.units) + '</td></tr>';
      });
      if (!rec.length) html += '<tr><td colspan="4" class="muted">Belum ada laporan.</td></tr>';
      html += '</tbody></table></div></div>';
    }
    html += '</div>';
    el.innerHTML = html;

    el.querySelectorAll('[data-student]').forEach(function (b) {
      b.addEventListener('click', function () {
        state.selected = b.getAttribute('data-student');
        renderDashboard(el, d, state);
      });
    });
    drawCharts(d, selStudent);
  }

  // "Semua": one row per santri with done / target / achievement per device type.
  function studentTableHtml(students, cats) {
    var html = '<div class="table-wrap"><table><thead><tr><th rowspan="2">No.</th><th rowspan="2">Nama</th>';
    html += '<th class="group" colspan="' + cats.length + '">Done</th><th class="group" colspan="' + cats.length + '">Target</th>';
    html += '<th class="group" colspan="' + cats.length + '">Achievement</th><th class="group" colspan="3">Akumulasi</th><th rowspan="2">Status</th></tr><tr>';
    for (var g = 0; g < 3; g++) cats.forEach(function (c) { html += '<th class="num">' + esc(c.label) + '</th>'; });
    html += '<th class="num">Prog.</th><th class="num">%</th><th></th></tr></thead><tbody>';
    students.forEach(function (s, i) {
      html += '<tr><td>' + (i + 1) + '</td><td>' + esc(s.name) + '</td>';
      cats.forEach(function (c) { html += '<td class="num">' + fmtNum(s.done[c.key]) + '</td>'; });
      cats.forEach(function (c) { html += '<td class="num">' + fmtNum(s.target[c.key]) + '</td>'; });
      cats.forEach(function (c) { html += '<td class="num">' + fmtPct(s.ach[c.key]) + '</td>'; });
      html += '<td class="num">' + fmtNum(s.totalDone) + '</td><td class="num">' + fmtPct(s.pct) + '</td>';
      html += '<td><div class="bar"><i style="width:' + Math.min(100, s.pct || 0) + '%"></i></div></td>';
      html += '<td>' + statusPill(s.status) + '</td></tr>';
    });
    if (!students.length) html += '<tr><td colspan="' + (6 + cats.length * 3) + '" class="muted">Belum ada santri.</td></tr>';
    return html + '</tbody></table></div>';
  }

  // One santri selected: every unit they reported through the form, newest first.
  function studentReportsHtml(s) {
    var reps = s.reports || [];
    var html = '<h2>Unit yang dilaporkan – ' + esc(s.name) + ' <span class="muted" style="font-weight:400">(' + reps.length + ' laporan)</span></h2>';
    html += '<div class="table-wrap"><table><thead><tr><th>No.</th><th>Tanggal</th><th>Perangkat</th><th>Detail</th><th class="num">Unit</th></tr></thead><tbody>';
    reps.forEach(function (r, i) {
      var det = (r.details || []).map(function (x) { return '<div><span class="muted">' + esc(x.label) + ':</span> ' + esc(x.value) + '</div>'; }).join('');
      html += '<tr><td>' + (reps.length - i) + '</td><td>' + esc(r.date) + '</td><td>' + esc(r.category) + '</td><td>' + (det || '<span class="muted">–</span>') +
        '</td><td class="num">' + fmtNum(r.units) + '</td></tr>';
    });
    if (!reps.length) html += '<tr><td colspan="5" class="muted">Belum ada laporan dari santri ini.</td></tr>';
    return html + '</tbody></table></div>';
  }

  /**
   * Recap for stages without unit targets (Stage 0): report count per santri, answer tallies,
   * and, when a santri is picked, only that santri's own reports.
   */
  function renderRecap(el, d, state) {
    var sel = state.selected || '';
    var students = d.students;
    var selStudent = students.filter(function (s) { return s.id === sel; })[0] || null;
    var html = '<div class="grid kpis" style="margin-bottom:16px">';
    if (selStudent) {
      html += kpi('Laporan', fmtNum(selStudent.count), esc(selStudent.name));
      html += kpi('Terakhir lapor', esc(selStudent.last || '–'), '');
    } else {
      html += kpi('Total laporan', fmtNum(d.totals.reports), 'Semua santri');
      html += kpi('Santri sudah lapor', d.totals.studentsReported + ' / ' + d.totals.students, '');
    }
    html += '</div>';

    html += '<div class="card"><div class="chips">';
    html += '<button class="chip' + (sel ? '' : ' active') + '" data-student="">Semua</button>';
    students.forEach(function (s) {
      html += '<button class="chip' + (sel === s.id ? ' active' : '') + '" data-student="' + esc(s.id) + '">' + esc(s.nickname || s.name.split(' ')[0]) + '</button>';
    });
    html += '</div>';
    if (selStudent) {
      var reps = selStudent.reports;
      html += '<h2>Laporan – ' + esc(selStudent.name) + ' <span class="muted" style="font-weight:400">(' + reps.length + ' laporan)</span></h2>';
      html += '<div class="table-wrap"><table><thead><tr><th>No.</th><th>Tanggal</th><th>Detail</th></tr></thead><tbody>';
      reps.forEach(function (r, i) {
        var det = r.details.map(function (x) { return '<div><span class="muted">' + esc(x.label) + ':</span> ' + esc(x.value) + '</div>'; }).join('');
        html += '<tr><td>' + (reps.length - i) + '</td><td>' + esc(r.date) + '</td><td>' + (det || '<span class="muted">–</span>') + '</td></tr>';
      });
      if (!reps.length) html += '<tr><td colspan="3" class="muted">Belum ada laporan dari santri ini.</td></tr>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>No.</th><th>Nama</th><th class="num">Jumlah laporan</th><th>Terakhir lapor</th></tr></thead><tbody>';
      students.forEach(function (s, i) {
        html += '<tr><td>' + (i + 1) + '</td><td>' + esc(s.name) + '</td><td class="num">' + fmtNum(s.count) + '</td><td>' +
          (s.last ? esc(s.last) : '<span class="pill behind">Belum lapor</span>') + '</td></tr>';
      });
      if (!students.length) html += '<tr><td colspan="4" class="muted">Belum ada santri.</td></tr>';
    }
    html += '</tbody></table></div></div>';

    if (!selStudent && d.tallies.length) {
      html += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">';
      d.tallies.forEach(function (t) {
        var max = Math.max.apply(null, t.items.map(function (x) { return x.count; }).concat([1]));
        html += '<div class="card"><h2>' + esc(t.label) + '</h2><table><tbody>';
        t.items.forEach(function (it) {
          html += '<tr><td>' + esc(it.option) + '</td><td class="num">' + fmtNum(it.count) + '</td>' +
            '<td style="width:35%"><div class="bar"><i style="width:' + Math.round(100 * it.count / max) + '%"></i></div></td></tr>';
        });
        html += '</tbody></table></div>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-student]').forEach(function (b) {
      b.addEventListener('click', function () { state.selected = b.getAttribute('data-student'); renderRecap(el, d, state); });
    });
  }

  /** Draws either dashboard kind returned by apiGetDashboard / apiDevGetDashboard. */
  function renderAnyDashboard(el, d, state) {
    if (d.kind === 'recap') renderRecap(el, d, state); else renderDashboard(el, d, state);
  }

  function kpi(label, value, hint) {
    return '<div class="kpi"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="hint">' + (hint || '') + '</div></div>';
  }

  function statusPill(s) {
    if (s === 'on-track') return '<span class="pill ok">Sesuai target</span>';
    if (s === 'behind') return '<span class="pill behind">Di bawah target</span>';
    return '<span class="pill none">–</span>';
  }

  function drawCharts(d, selStudent) {
    if (typeof Chart === 'undefined') return;
    Object.keys(charts).forEach(function (k) { charts[k].destroy(); });
    charts = {};
    var accent = cssVar('--accent'), muted = cssVar('--muted'), border = cssVar('--border'), text = cssVar('--text');
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    var labels = [];
    for (var i = 1; i <= d.seriesLen; i++) labels.push(i);
    var actual;
    if (selStudent) actual = selStudent.cumulative.slice();
    else {
      var n = d.students.length || 1;
      actual = labels.map(function (_, idx) {
        var sum = 0;
        d.students.forEach(function (s) { sum += s.cumulative[idx] || 0; });
        return Math.round(sum / n * 10) / 10;
      });
    }
    // Do not draw actual progress into the future.
    actual = actual.map(function (v, idx) { return idx < d.day ? v : null; });
    charts.line = new Chart(document.getElementById('chartLine'), {
      type: 'line',
      data: { labels: labels, datasets: [
        { label: 'Aktual', data: actual, borderColor: accent, backgroundColor: accent, pointRadius: 0, borderWidth: 2.5, spanGaps: true },
        { label: 'Target milestone', data: d.plan, borderColor: muted, borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5 }
      ] },
      options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        scales: { x: { title: { display: true, text: 'Hari ke' } }, y: { beginAtZero: true, title: { display: true, text: 'Unit' } } },
        plugins: { legend: { labels: { color: text } } } }
    });
    var palette = ['#0f6e5a', '#3b82c4', '#c27c0e', '#8e5bd1', '#c2410c', '#64748b'];
    if (!document.getElementById('chartBar')) return;
    charts.bar = new Chart(document.getElementById('chartBar'), {
      type: 'bar',
      data: { labels: d.students.map(function (s) { return s.nickname || s.name.split(' ')[0]; }),
        datasets: d.categories.map(function (c, i) {
          return { label: c.label, data: d.students.map(function (s) { return s.done[c.key]; }), backgroundColor: palette[i % palette.length], stack: 'u' };
        }) },
      options: { maintainAspectRatio: false, indexAxis: d.students.length > 10 ? 'y' : 'x',
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
        plugins: { legend: { labels: { color: text } } } }
    });
  }
</script>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbzGmr4clWBx3d_TnrHlSGZU4-RlsuONVbDmKB4PEV-EC-m0Mulkg6rY73BjW8BSE_9C/exec";
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('Server tidak merespons (' + r.status + '). Coba lagi.'); return r.json(); },
        function () { throw new Error('Tidak ada koneksi ke server. Periksa internet lalu coba lagi.'); })
      .then(function (res) { if (!res.ok) throw new Error(res.error); return res.result; });
  }
</script>
  <script>
    var QS = new URLSearchParams(location.search);
    function qp(k, re) { return String(QS.get(k) || '').replace(re, ''); }
    var INITIAL_BATCH = qp('batch', /[^A-Za-z0-9_-]/g), INITIAL_STAGE = qp('stage', /[^a-z0-9]/g),
      INITIAL_VIEW = QS.get('view') === 'dashboard' ? 'dashboard' : 'form';
    var pub = null, stage = null, form = null, dash = {}, dashState = { selected: '' }, currentTab = 'form';

    setTabs(document.getElementById('tabs'), function (tab) {
      currentTab = tab;
      if (tab === 'dashboard') loadDashboard();
    });

    document.getElementById('batchSelect').addEventListener('change', function (e) {
      loadPublic(e.target.value);
    });
    document.getElementById('backBtn').addEventListener('click', showHome);

    function loadPublic(batchId) {
      document.getElementById('stageList').innerHTML = '<div class="loading">Memuat…</div>';
      showHome();
      return call('apiGetPublic', batchId || '').then(function (p) {
        pub = p;
        dash = {};
        var sel = document.getElementById('batchSelect');
        sel.innerHTML = p.batches.map(function (b) {
          return '<option value="' + esc(b.id) + '"' + (b.id === p.batch.id ? ' selected' : '') + '>' +
            esc(b.name) + (b.status === 'archived' ? ' (arsip)' : '') + '</option>';
        }).join('');
        document.getElementById('subtitle').textContent = p.batchName;
        renderStages();
        loadBanner(p.batch.id);
      }).catch(function (e) {
        document.getElementById('stageList').innerHTML = '<div class="notice err">' + esc(e.message) + '</div>';
      });
    }

    // Main banner on the stage picker; each stage shows its own (the server falls back to the main one).
    var bannerReq = 0;
    function loadBanner(batchId, stageKey) {
      var req = ++bannerReq;
      call('apiGetBanner', batchId, stageKey || '').then(function (url) {
        if (req !== bannerReq || !pub || pub.batch.id !== batchId) return;
        document.getElementById('bannerImg').src = url || '';
        document.getElementById('banner').classList.toggle('hidden', !url);
      }).catch(function () { document.getElementById('banner').classList.add('hidden'); });
    }

    function renderStages() {
      var el = document.getElementById('stageList');
      el.innerHTML = pub.stages.map(function (st) {
        var usable = !!pub.forms[st.key];
        var pill = st.status !== 'open' ? '<span class="pill none">🔒 Terkunci</span>'
          : usable ? '<span class="pill ok">Terbuka</span>' : '<span class="pill none">Segera hadir</span>';
        return '<button class="stage-card" data-stage="' + esc(st.key) + '"' + (usable ? '' : ' disabled') + '>' +
          '<span class="name">' + esc(st.name) + '</span><span class="desc">' + esc(st.description) + '</span><span>' + pill + '</span></button>';
      }).join('');
      el.querySelectorAll('[data-stage]').forEach(function (b) {
        b.addEventListener('click', function () { openStage(b.getAttribute('data-stage')); });
      });
    }

    function showHome() {
      if (stage && pub) loadBanner(pub.batch.id);
      stage = null;
      document.getElementById('home').classList.remove('hidden');
      document.getElementById('stageView').classList.add('hidden');
    }

    function openStage(key, view) {
      if (!pub.forms[key]) return;
      stage = pub.stages.filter(function (s) { return s.key === key; })[0];
      form = pub.forms[key];
      dashState.selected = '';
      document.getElementById('home').classList.add('hidden');
      document.getElementById('stageView').classList.remove('hidden');
      document.getElementById('stageTitle').textContent = stage.name;
      loadBanner(pub.batch.id, key);
      document.getElementById('formTitle').textContent = form.settings.formTitle;
      document.getElementById('formDesc').textContent = form.settings.formDescription;
      document.getElementById('dashTitle').textContent = form.settings.dashboardTitle;
      renderForm();
      document.querySelector('#tabs [data-tab="' + (view === 'dashboard' ? 'dashboard' : 'form') + '"]').click();
    }

    function renderForm() {
      var el = document.getElementById('reportForm');
      document.getElementById('formMsg').innerHTML = '';
      if (!form.settings.formOpen) {
        el.innerHTML = '<div class="notice info">Form untuk batch ini sedang ditutup.</div>';
        return;
      }
      var html = '', section = null;
      form.fields.forEach(function (f) {
        if (f.section && f.section !== section) { section = f.section; html += '<h3>' + esc(section) + '</h3>'; }
        html += fieldHtml(f);
      });
      html += '<div class="row"><button class="btn primary" type="submit" id="submitBtn">Kirim laporan</button>' +
        '<button class="btn" type="submit" id="anotherBtn" data-another title="Simpan laporan ini lalu buka form kosong">Masukan laporan lainnya</button></div>';
      el.innerHTML = html;
    }

    function fieldHtml(f) {
      var id = 'f_' + f.key, name = esc(f.key), req = f.required ? ' required' : '';
      var input = '';
      switch (f.type) {
        case 'textarea': input = '<textarea id="' + id + '" name="' + name + '"' + req + '></textarea>'; break;
        case 'number': input = '<input type="number" inputmode="numeric" min="0" step="1" id="' + id + '" name="' + name + '"' + req + '>'; break;
        case 'date': input = '<input type="date" id="' + id + '" name="' + name + '" value="' + esc(pub.today) + '"' + req + '>'; break;
        case 'student':
          input = '<select id="' + id + '" name="' + name + '"' + req + '><option value="">— Pilih nama —</option>' +
            pub.students.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select>';
          break;
        case 'select':
          input = '<select id="' + id + '" name="' + name + '"' + req + '><option value="">— Pilih —</option>' +
            f.options.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';
          break;
        case 'category':
        case 'radio':
          var opts = f.type === 'category' ? form.categories.map(function (c) { return { v: c.key, l: c.label }; })
            : f.options.map(function (o) { return { v: o, l: o }; });
          input = opts.map(function (o) {
            return '<label class="choice"><input type="radio" name="' + name + '" value="' + esc(o.v) + '"> ' + esc(o.l) + '</label>';
          }).join('');
          break;
        case 'checkbox':
          input = f.options.map(function (o) {
            return '<label class="choice"><input type="checkbox" name="' + name + '" value="' + esc(o) + '"> ' + esc(o) + '</label>';
          }).join('');
          break;
        case 'file':
          input = '<input type="file" id="' + id + '" name="' + name + '" accept="image/*,video/*" data-preview="pv_' + esc(f.key) + '">' +
            '<div class="file-preview" id="pv_' + esc(f.key) + '"></div>';
          break;
        default: input = '<input type="text" id="' + id + '" name="' + name + '"' + req + '>';
      }
      var wrap = (f.type === 'radio' || f.type === 'category' || f.type === 'checkbox') ? 'div' : 'label';
      return '<' + wrap + ' class="field"><span class="lbl">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</span>' +
        (f.help ? '<span class="help">' + esc(f.help) + '</span>' : '') + input + '</' + wrap + '>';
    }

    // Small preview under each photo/video input.
    document.getElementById('reportForm').addEventListener('change', function (e) {
      var t = e.target;
      if (t.type !== 'file' || !t.getAttribute('data-preview')) return;
      var box = document.getElementById(t.getAttribute('data-preview'));
      var file = t.files[0];
      box.innerHTML = '';
      if (!file) return;
      var url = URL.createObjectURL(file);
      box.innerHTML = /^video\//.test(file.type) ? '<video src="' + url + '" muted controls></video>' : '<img src="' + url + '" alt="">';
    });

    /** Shows the blank form again, e.g. after "Masukan laporan lainnya". */
    function blankForm(notice) {
      renderForm();
      if (notice) document.getElementById('formMsg').innerHTML = notice;
      document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('formMsg').addEventListener('click', function (e) {
      if (e.target.closest('[data-new-report]')) blankForm();
    });

    document.getElementById('reportForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // "Masukan laporan lainnya": save this report, then reopen the same form blank.
      var another = !!(e.submitter && e.submitter.hasAttribute('data-another'));
      var el = e.target, answers = {}, missing = [], pending = [];
      form.fields.forEach(function (f) {
        if (f.type === 'checkbox') {
          answers[f.key] = Array.prototype.map.call(el.querySelectorAll('input[name="' + f.key + '"]:checked'), function (x) { return x.value; });
          if (f.required && !answers[f.key].length) missing.push(f.label);
        } else if (f.type === 'radio' || f.type === 'category') {
          var c = el.querySelector('input[name="' + f.key + '"]:checked');
          answers[f.key] = c ? c.value : '';
          if (f.required && !c) missing.push(f.label);
        } else if (f.type === 'file') {
          var file = el.elements[f.key].files[0];
          if (f.required && !file) missing.push(f.label);
          if (file) pending.push(readFile(file, 1600).then(function (v) { answers[f.key] = v; }));
        } else {
          answers[f.key] = el.elements[f.key].value;
          if (f.required && !String(answers[f.key]).trim()) missing.push(f.label);
        }
      });
      var msg = document.getElementById('formMsg');
      if (missing.length) {
        msg.innerHTML = '<div class="notice err">Wajib diisi: ' + esc(missing.join(', ')) + '</div>';
        msg.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      var btn = another ? document.getElementById('anotherBtn') : document.getElementById('submitBtn'), stageKey = stage.key, label = btn.textContent;
      el.querySelectorAll('button[type=submit]').forEach(function (b) { b.disabled = true; });
      btn.textContent = 'Mengirim…';
      Promise.all(pending).then(function () {
        return call('apiSubmitReport', pub.batch.id, answers, stageKey);
      }).then(function () {
        delete dash[stageKey];
        var ok = '<div class="notice ok">' + esc(form.settings.successMessage) + '</div>';
        if (another) return blankForm(ok + '<p class="muted">Laporan sebelumnya tersimpan. Silakan isi laporan berikutnya.</p>');
        // Like Google Forms: a thank-you screen with a way to send another report.
        el.innerHTML = '';
        msg.innerHTML = ok + '<div class="row"><button class="btn primary" type="button" data-new-report>Masukan laporan lainnya</button></div>';
        msg.scrollIntoView({ behavior: 'smooth' });
      }).catch(function (err) {
        msg.innerHTML = '<div class="notice err">' + esc(err.message) + '</div>';
        msg.scrollIntoView({ behavior: 'smooth' });
        el.querySelectorAll('button[type=submit]').forEach(function (b) { b.disabled = false; });
        btn.textContent = label;
      });
    });

    function loadDashboard() {
      var el = document.getElementById('dashboard');
      if (!pub || !stage) return;
      var key = stage.key;
      if (dash[key]) { renderAnyDashboard(el, dash[key], dashState); return; }
      el.innerHTML = '<div class="loading">Memuat dashboard…</div>';
      call('apiGetDashboard', pub.batch.id, key).then(function (d) {
        dash[key] = d;
        if (stage && stage.key === key) renderAnyDashboard(el, d, dashState);
      }).catch(function (e) { el.innerHTML = '<div class="notice err">' + esc(e.message) + '</div>'; });
    }

    loadPublic(INITIAL_BATCH).then(function () {
      // Old links (?view=dashboard without a stage) meant Stage 1.
      var key = INITIAL_STAGE || (INITIAL_VIEW === 'dashboard' ? 'stage1' : '');
      if (pub && key && pub.forms[key]) openStage(key, INITIAL_VIEW);
    });
  </script>
