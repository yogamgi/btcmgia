<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
</head>
<body>
  <div id="banner" class="banner hidden"><img id="bannerImg" alt="Banner"></div>
  <header class="top">
    <div>
      <h1>BTC - Boarding Technician Camp</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <label class="row"><span class="muted">Batch</span>
      <select id="batchSelect" style="width:auto"></select>
    </label>
  </header>
  <main>
    <section id="home">
      <img class="logo" src="https://yogamgi.github.io/btcmgia/logo.png" alt="Boarding Technician Camp" width="640" height="335">
      <div class="card" style="max-width:420px;margin:0 auto 24px">
        <h2>Masuk</h2>
        <p class="muted">Pilih nama kamu dan masukkan password stage dari pembimbing.</p>
        <div id="loginMsg"></div>
        <form id="loginForm" novalidate>
          <label class="field" for="loginStudent"><span class="lbl">Nama santri</span>
            <select id="loginStudent"><option value="">Memuat…</option></select></label>
          <label class="field" for="loginPw"><span class="lbl">Password</span>
            <input type="password" id="loginPw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
          <button class="btn primary" type="submit" id="loginBtn">Masuk</button>
        </form>
      </div>
    </section>

    <section id="lockedView" class="hidden">
      <div class="card" style="max-width:520px;margin:24px auto;text-align:center">
        <div style="font-size:40px">🔒</div>
        <h2 id="lockedTitle"></h2>
        <p id="lockedText"></p>
        <div class="row" style="justify-content:center"><button class="btn primary" id="recheckBtn">Cek lagi</button>
          <button class="btn" data-logout>Keluar</button></div>
      </div>
    </section>

    <section id="stageView" class="hidden">
      <div class="row" style="margin-bottom:8px">
        <h2 id="stageTitle" style="margin:0"></h2>
        <span class="spacer"></span>
        <span class="muted" id="whoAmI"></span>
        <button class="btn sm" data-logout>Keluar</button>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="form" class="active">Isi Laporan</button>
        <button data-tab="dashboard">Dashboard</button>
      </nav>
      <section data-panel="form">
        <div class="card" style="max-width:720px">
          <h2 id="formTitle">Laporan</h2>
          <p class="muted" id="formDesc"></p>
          <div id="formMsg"></div>
          <form id="reportForm" novalidate></form>
        </div>
      </section>
      <section data-panel="dashboard" class="hidden">
        <h2 id="dashTitle" style="margin:0 0 12px">Dashboard</h2>
        <div id="dashboard"></div>
      </section>
    </section>
  </main>
  <div id="toast"></div>

  <?!= include('Shared'); ?>
  <script>
    var INITIAL_BATCH = '<?= initialBatch ?>', INITIAL_STAGE = '<?= initialStage ?>', INITIAL_VIEW = '<?= initialView ?>';
    var pub = null, stage = null, form = null, today = '', dash = {}, dashState = { selected: '' }, currentTab = 'form';
    // Guest login, remembered on this device until "Keluar": { batchId, student, studentName, password, stageKey }.
    var auth = store.get('auth');
    function saveAuth() { store.set('auth', auth); }

    setTabs(document.getElementById('tabs'), function (tab) {
      currentTab = tab;
      if (tab === 'dashboard') loadDashboard();
    });

    document.getElementById('batchSelect').addEventListener('change', function (e) {
      loadPublic(e.target.value).then(route);
    });
    document.querySelectorAll('[data-logout]').forEach(function (b) { b.addEventListener('click', logout); });
    document.getElementById('recheckBtn').addEventListener('click', function () {
      var b = this; b.disabled = true; b.textContent = 'Memeriksa…';
      loadStage(true).then(function () { b.disabled = false; b.textContent = 'Cek lagi'; });
    });

    function logout() {
      auth = null; saveAuth();
      document.getElementById('loginPw').value = '';
      setUrl();
      showHome();
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('loginMsg'), btn = document.getElementById('loginBtn');
      var student = document.getElementById('loginStudent').value, pw = document.getElementById('loginPw').value.trim();
      msg.innerHTML = '';
      if (!pub) { msg.innerHTML = '<div class="notice err">Data belum termuat. Periksa internet lalu muat ulang halaman.</div>'; return; }
      if (!student) { msg.innerHTML = '<div class="notice err">Pilih nama santri dulu.</div>'; return; }
      if (!pw) { msg.innerHTML = '<div class="notice err">Isi password dulu.</div>'; return; }
      btn.disabled = true; btn.textContent = 'Memeriksa…';
      call('apiGuestLogin', pub.batch.id, student, pw).then(function (r) {
        auth = { batchId: pub.batch.id, student: r.studentId, studentName: r.studentName, password: pw, stageKey: r.stageKey };
        saveAuth();
        return loadStage(true);
      }).catch(function (err) { msg.innerHTML = '<div class="notice err">' + esc(err.message) + '</div>'; })
        .then(function () { btn.disabled = false; btn.textContent = 'Masuk'; });
    });

    function creds() { return { student: auth.student, password: auth.password }; }
    function stageCacheKey() { return 'stage:' + auth.batchId + ':' + auth.stageKey + ':' + auth.student; }

    /** Loads only the logged-in santri's stage (status + form). Shows the saved copy first when there is one. */
    function loadStage(fresh) {
      if (!auth) return Promise.resolve(showHome());
      var cached = !fresh && store.get(stageCacheKey());
      if (cached) showStage(cached);
      return call('apiGetStage', auth.batchId, auth.stageKey, creds()).then(function (r) {
        store.set(stageCacheKey(), r);
        showStage(r);
      }).catch(function (err) {
        if (loginExpired(err)) return;
        if (!cached) { showHome(); document.getElementById('loginMsg').innerHTML = '<div class="notice err">' + esc(err.message) + '</div>'; }
      });
    }

    /** The stage's form, or a "please wait" screen while it is locked. */
    function showStage(r) {
      var same = stage && stage.key === r.stage.key && form && JSON.stringify(form) === JSON.stringify(r.form);
      stage = r.stage; today = r.today;
      setBanner(r.banner, stage.key);
      setUrl();
      if (!r.form) {
        form = null;
        showOnly('lockedView');
        document.getElementById('lockedTitle').textContent = stage.name;
        document.getElementById('lockedText').textContent = stage.status !== 'open'
          ? 'Halo ' + auth.studentName + ', ' + stage.name + ' masih terkunci. Tunggu sampai dibuka oleh pembimbing, lalu tekan "Cek lagi".'
          : 'Halo ' + auth.studentName + ', form ' + stage.name + ' segera hadir. Tunggu informasi dari pembimbing.';
        return;
      }
      if (same && !document.getElementById('stageView').classList.contains('hidden')) return; // keep what the santri is typing
      form = r.form;
      dashState.selected = auth.student; // dashboard opens on the santri's own reports
      showOnly('stageView');
      document.getElementById('stageTitle').textContent = stage.name;
      document.getElementById('whoAmI').textContent = auth.studentName;
      document.getElementById('formTitle').textContent = form.settings.formTitle;
      document.getElementById('formDesc').textContent = form.settings.formDescription;
      document.getElementById('dashTitle').textContent = form.settings.dashboardTitle;
      renderForm();
      document.querySelector('#tabs [data-tab="' + (INITIAL_VIEW === 'dashboard' ? 'dashboard' : 'form') + '"]').click();
    }

    /** Static site only: the address shows the stage and santri, so each has its own page link. */
    function setUrl() {
      if (typeof google !== 'undefined' || !window.history || !history.replaceState) return;
      var q = new URLSearchParams(location.search);
      ['stage', 'santri'].forEach(function (k) { q.delete(k); });
      if (auth) { q.set('stage', auth.stageKey); q.set('santri', auth.student); }
      var qs = q.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    }

    function route() {
      if (auth && pub && auth.batchId === pub.batch.id) return loadStage(false);
      showHome();
    }

    function showOnly(id) {
      ['home', 'lockedView', 'stageView'].forEach(function (x) { document.getElementById(x).classList.toggle('hidden', x !== id); });
    }

    /** Login data (santri names, stages, banners). The saved copy shows at once; fresh data replaces it. */
    function loadPublic(batchId) {
      var key = 'pub:' + (batchId || 'default');
      var cached = store.get(key);
      if (cached) applyPublic(cached);
      return call('apiGetPublic', batchId || '').then(function (p) {
        store.set(key, p);
        applyPublic(p);
      }).catch(function (e) {
        if (!cached) document.getElementById('loginMsg').innerHTML = '<div class="notice err">' + esc(e.message) +
          ' <button class="btn sm" type="button" onclick="location.reload()">Muat ulang</button></div>';
      });
    }

    function applyPublic(p) {
      pub = p;
      dash = {};
      document.getElementById('batchSelect').innerHTML = p.batches.map(function (b) {
        return '<option value="' + esc(b.id) + '"' + (b.id === p.batch.id ? ' selected' : '') + '>' +
          esc(b.name) + (b.status === 'archived' ? ' (arsip)' : '') + '</option>';
      }).join('');
      document.getElementById('subtitle').textContent = p.batchName;
      var sel = document.getElementById('loginStudent'), cur = sel.value;
      sel.innerHTML = '<option value="">— Pilih nama —</option>' + p.students.map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === cur ? ' selected' : '') + '>' + esc(s.name) + '</option>';
      }).join('');
      if (!stage) setBanner(p.banners && p.banners[''], '');
    }

    // Banners load straight from Google's image servers; if that fails, the server sends the image itself.
    var bannerFor = null;
    function setBanner(url, stageKey) {
      var box = document.getElementById('banner'), img = document.getElementById('bannerImg');
      var batchId = pub ? pub.batch.id : (auth ? auth.batchId : '');
      var tag = batchId + '|' + stageKey + '|' + (url || '');
      if (tag === bannerFor) return;
      bannerFor = tag;
      if (!url) { box.classList.add('hidden'); img.removeAttribute('src'); return; }
      img.onload = function () { box.classList.remove('hidden'); };
      img.onerror = function () {
        if (bannerFor !== tag || !batchId) return;
        call('apiGetBanner', batchId, stageKey).then(function (data) {
          if (bannerFor !== tag) return;
          img.onerror = function () { box.classList.add('hidden'); };
          if (data) img.src = data; else box.classList.add('hidden');
        }).catch(function () { box.classList.add('hidden'); });
      };
      img.src = url;
    }

    function showHome() {
      stage = null; form = null;
      if (pub) setBanner(pub.banners && pub.banners[''], '');
      showOnly('home');
    }

    function renderForm() {
      var el = document.getElementById('reportForm');
      document.getElementById('formMsg').innerHTML = '';
      if (!form.settings.formOpen) {
        el.innerHTML = '<div class="notice info">Form untuk batch ini sedang ditutup.</div>';
        return;
      }
      var html = '', section = null;
      form.fields.forEach(function (f) {
        if (f.section && f.section !== section) { section = f.section; html += '<h3>' + esc(section) + '</h3>'; }
        html += fieldHtml(f);
      });
      html += '<div class="row"><button class="btn primary" type="submit" id="submitBtn">Kirim laporan</button>' +
        '<button class="btn" type="submit" id="anotherBtn" data-another title="Simpan laporan ini lalu buka form kosong">Masukan laporan lainnya</button></div>';
      el.innerHTML = html;
    }

    function fieldHtml(f) {
      var id = 'f_' + f.key, name = esc(f.key), req = f.required ? ' required' : '';
      var input = '';
      switch (f.type) {
        case 'textarea': input = '<textarea id="' + id + '" name="' + name + '"' + req + '></textarea>'; break;
        case 'number': input = '<input type="number" inputmode="numeric" min="0" step="1" id="' + id + '" name="' + name + '"' + req + '>'; break;
        case 'date': input = '<input type="date" id="' + id + '" name="' + name + '" value="' + esc(today) + '"' + req + '>'; break;
        case 'student':
          // Always the santri who logged in; the server files the report under that login too.
          input = '<select id="' + id + '" name="' + name + '" disabled><option value="' + esc(auth.student) + '">' + esc(auth.studentName) + '</option></select>';
          break;
        case 'select':
          input = '<select id="' + id + '" name="' + name + '"' + req + '><option value="">— Pilih —</option>' +
            f.options.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';
          break;
        case 'category':
        case 'radio':
          var opts = f.type === 'category' ? form.categories.map(function (c) { return { v: c.key, l: c.label }; })
            : f.options.map(function (o) { return { v: o, l: o }; });
          input = opts.map(function (o) {
            return '<label class="choice"><input type="radio" name="' + name + '" value="' + esc(o.v) + '"> ' + esc(o.l) + '</label>';
          }).join('');
          break;
        case 'checkbox':
          input = f.options.map(function (o) {
            return '<label class="choice"><input type="checkbox" name="' + name + '" value="' + esc(o) + '"> ' + esc(o) + '</label>';
          }).join('');
          break;
        case 'file':
          input = '<input type="file" id="' + id + '" name="' + name + '" accept="image/*,video/*" data-preview="pv_' + esc(f.key) + '">' +
            '<div class="file-preview" id="pv_' + esc(f.key) + '"></div>';
          break;
        default: input = '<input type="text" id="' + id + '" name="' + name + '"' + req + '>';
      }
      var wrap = (f.type === 'radio' || f.type === 'category' || f.type === 'checkbox') ? 'div' : 'label';
      return '<' + wrap + ' class="field"><span class="lbl">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</span>' +
        (f.help ? '<span class="help">' + esc(f.help) + '</span>' : '') + input + '</' + wrap + '>';
    }

    // Small preview under each photo/video input.
    document.getElementById('reportForm').addEventListener('change', function (e) {
      var t = e.target;
      if (t.type !== 'file' || !t.getAttribute('data-preview')) return;
      var box = document.getElementById(t.getAttribute('data-preview'));
      var file = t.files[0];
      box.innerHTML = '';
      if (!file) return;
      var url = URL.createObjectURL(file);
      box.innerHTML = /^video\//.test(file.type) ? '<video src="' + url + '" muted controls></video>' : '<img src="' + url + '" alt="">';
    });

    /** Shows the blank form again, e.g. after "Masukan laporan lainnya". */
    function blankForm(notice) {
      renderForm();
      if (notice) document.getElementById('formMsg').innerHTML = notice;
      document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('formMsg').addEventListener('click', function (e) {
      if (e.target.closest('[data-new-report]')) blankForm();
    });

    document.getElementById('reportForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // "Masukan laporan lainnya": save this report, then reopen the same form blank.
      var another = !!(e.submitter && e.submitter.hasAttribute('data-another'));
      var el = e.target, answers = {}, missing = [], pending = [];
      form.fields.forEach(function (f) {
        if (f.type === 'checkbox') {
          answers[f.key] = Array.prototype.map.call(el.querySelectorAll('input[name="' + f.key + '"]:checked'), function (x) { return x.value; });
          if (f.required && !answers[f.key].length) missing.push(f.label);
        } else if (f.type === 'radio' || f.type === 'category') {
          var c = el.querySelector('input[name="' + f.key + '"]:checked');
          answers[f.key] = c ? c.value : '';
          if (f.required && !c) missing.push(f.label);
        } else if (f.type === 'file') {
          var file = el.elements[f.key].files[0];
          if (f.required && !file) missing.push(f.label);
          if (file) pending.push(readFile(file, 1600).then(function (v) { answers[f.key] = v; }));
        } else {
          answers[f.key] = el.elements[f.key].value;
          if (f.required && !String(answers[f.key]).trim()) missing.push(f.label);
        }
      });
      var msg = document.getElementById('formMsg');
      if (missing.length) {
        msg.innerHTML = '<div class="notice err">Wajib diisi: ' + esc(missing.join(', ')) + '</div>';
        msg.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      answers.clientId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      var btn = another ? document.getElementById('anotherBtn') : document.getElementById('submitBtn'), stageKey = stage.key, label = btn.textContent;
      el.querySelectorAll('button[type=submit]').forEach(function (b) { b.disabled = true; });
      btn.textContent = 'Mengirim…';
      Promise.all(pending).then(function () {
        return call('apiSubmitReport', auth.batchId, answers, stageKey, creds());
      }).then(function () {
        delete dash[stageKey];
        var ok = '<div class="notice ok">' + esc(form.settings.successMessage) + '</div>';
        if (another) return blankForm(ok + '<p class="muted">Laporan sebelumnya tersimpan. Silakan isi laporan berikutnya.</p>');
        // Like Google Forms: a thank-you screen with a way to send another report.
        el.innerHTML = '';
        msg.innerHTML = ok + '<div class="row"><button class="btn primary" type="button" data-new-report>Masukan laporan lainnya</button></div>';
        msg.scrollIntoView({ behavior: 'smooth' });
      }).catch(function (err) {
        if (loginExpired(err)) return;
        msg.innerHTML = '<div class="notice err">' + esc(err.message) + '</div>';
        msg.scrollIntoView({ behavior: 'smooth' });
        el.querySelectorAll('button[type=submit]').forEach(function (b) { b.disabled = false; });
        btn.textContent = label;
      });
    });

    function loadDashboard() {
      var el = document.getElementById('dashboard');
      if (!auth || !stage) return;
      var key = stage.key;
      if (dash[key]) { renderAnyDashboard(el, dash[key], dashState); return; }
      el.innerHTML = '<div class="loading">Memuat dashboard…</div>';
      call('apiGetDashboard', auth.batchId, key, creds()).then(function (d) {
        dash[key] = d;
        if (stage && stage.key === key) renderAnyDashboard(el, d, dashState);
      }).catch(function (e) { if (!loginExpired(e)) el.innerHTML = '<div class="notice err">' + esc(e.message) + '</div>'; });
    }

    /** The stage password changed or the santri was removed: back to the login panel. */
    function loginExpired(err) {
      if (String(err && err.message).indexOf('LOGIN_REQUIRED') < 0) return false;
      logout();
      document.getElementById('loginMsg').innerHTML = '<div class="notice err">Silakan masuk lagi.</div>';
      return true;
    }

    // A santri who is still logged in on this device goes straight to their stage.
    showOnly(auth ? 'lockedView' : 'home');
    if (auth) { document.getElementById('lockedTitle').textContent = 'Memuat…'; document.getElementById('lockedText').textContent = ''; }
    if (auth) loadStage(false);
    loadPublic((auth && auth.batchId) || INITIAL_BATCH).then(function () { if (!auth) showHome(); });
  </script>
</body>
</html>
