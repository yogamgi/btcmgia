<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef1f5; --text: #1b2330; --muted: #5f6b7a;
    --border: #d9dee6; --accent: #0f6e5a; --accent-2: #e6f3ef; --danger: #b42318; --danger-bg: #fdecea;
    --warn: #9a6700; --warn-bg: #fff4d6; --ok: #137333; --ok-bg: #e6f4ea; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --surface: #1a2028; --surface-2: #222a35; --text: #e6eaf0; --muted: #9aa5b4;
      --border: #2e3846; --accent: #4cc3a3; --accent-2: #173a32; --danger: #ff8a80; --danger-bg: #3a1d1b;
      --warn: #f2c14e; --warn-bg: #3a2f12; --ok: #7bd88f; --ok-bg: #173322; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header.top h1 { font-size: 18px; margin: 0; }
  header.top .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px;
    color: var(--muted); font: inherit; cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .card h3 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .hint { color: var(--muted); font-size: 12px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span.lbl { display: block; font-weight: 600; margin-bottom: 4px; }
  label.field .req { color: var(--danger); }
  label.field .help { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 80px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: auto; }
  .choice { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 8px; font-size: 13px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .notice { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; white-space: pre-line; }
  .notice.ok { background: var(--ok-bg); color: var(--ok); }
  .notice.err { background: var(--danger-bg); color: var(--danger); }
  .notice.info { background: var(--accent-2); color: var(--text); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: middle; }
  th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.group { text-align: center; }
  tr.selected td { background: var(--accent-2); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.behind { background: var(--warn-bg); color: var(--warn); }
  .pill.none { background: var(--surface-2); color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px;
    padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .chart-box { position: relative; height: 300px; }
  .editor td input, .editor td select, .editor td textarea { padding: 4px 6px; border-radius: 6px; min-width: 80px; }
  .editor td textarea { min-height: 34px; }
  .editor td.actions { white-space: nowrap; }
  .editor th.sortable { cursor: pointer; user-select: none; }
  .editor th.sel, .editor td.sel { width: 32px; text-align: center; }
  .editor tr.selected td { background: var(--accent-2); }
  .editor td input:disabled, .editor td select:disabled { opacity: .55; cursor: not-allowed; }
  .bulkbar { gap: 8px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  .bulkbar input, .bulkbar select { width: auto; max-width: 260px; padding: 4px 8px; }
  .banner { background: var(--surface); line-height: 0; }
  .banner img { display: block; width: 100%; max-height: 260px; object-fit: cover; }
  .file-preview img, .file-preview video { display: block; margin-top: 8px; max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); }
  .stage-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .stage-card { text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
  .stage-card:hover:not(:disabled) { border-color: var(--accent); }
  .stage-card:disabled { cursor: not-allowed; opacity: .65; }
  .stage-card .name { font-size: 17px; font-weight: 650; }
  .stage-card .desc { color: var(--muted); font-size: 14px; flex: 1; }
  .logo { display: block; width: 100%; max-width: 360px; height: auto; margin: 16px auto 12px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 12px; z-index: 20; overflow-y: auto; }
  .modal { background: var(--surface); color: var(--text); border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 640px; }
  .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-body { padding: 16px; }
  .bell { position: relative; }
  .bell .badge { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; border-radius: 999px;
    font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; font-weight: 700; }
  .log-item { border-bottom: 1px solid var(--border); padding: 8px 0; }
  .log-item:last-child { border-bottom: 0; }
  .log-item .meta { color: var(--muted); font-size: 12px; }
  /* ---------- game layer ---------- */
  .journey { display: flex; align-items: flex-start; justify-content: center; gap: 0; margin: 4px 0 14px; }
  .journey:empty { display: none; }
  .journey .node { display: flex; flex-direction: column; align-items: center; text-align: center; width: 104px; flex: 0 0 auto; }
  .journey .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
    background: var(--surface); border: 2px solid var(--border); }
  .journey .node.current .dot { border-color: var(--accent); background: var(--accent-2); box-shadow: 0 0 0 4px var(--accent-2); animation: pulse 2s ease-in-out infinite; }
  .journey .node.locked .dot { opacity: .6; }
  .journey .nm { font-size: 12px; font-weight: 600; margin-top: 6px; line-height: 1.25; }
  .journey .st { font-size: 11px; color: var(--muted); }
  .journey .link { flex: 1 1 24px; max-width: 80px; height: 3px; background: var(--accent); margin-top: 21px; border-radius: 2px; }
  .journey .link.locked { background: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 10px); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px transparent; } }
  .quest { background: linear-gradient(135deg, var(--accent-2), var(--surface) 60%); }
  .quest-top { display: flex; align-items: center; gap: 12px; }
  .quest .lvl { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 30px;
    background: var(--surface); border: 2px solid var(--accent); flex: 0 0 auto; }
  .quest-main { flex: 1; min-width: 0; }
  .quest-name { font-weight: 700; font-size: 17px; }
  .quest-xp { text-align: right; }
  .quest-xp .xp { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #f5b301); border-radius: inherit; transition: width .8s ease; }
  .bar.big { height: 14px; margin: 12px 0 8px; }
  .quest-meta { font-size: 14px; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .chip.hot { border-color: #f5b301; }
  .chip.warn { border-color: var(--danger); color: var(--danger); }
  .mission { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--accent); font-size: 14px; }
  .badges { display: flex; gap: 8px; margin: 10px -4px 6px; padding: 0 4px 4px; overflow-x: auto; scroll-snap-type: x proximity; }
  .badge-i { flex: 0 0 84px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 4px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); opacity: .55; filter: grayscale(1); }
  .badge-i.on { opacity: 1; filter: none; border-color: #f5b301; }
  .badge-i .ic { font-size: 24px; }
  .badge-i .bn { font-size: 11px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .badge-i .bp { font-size: 10px; color: var(--muted); }
  .small { font-size: 12px; }
  .fprog { margin: 0 0 14px; font-size: 14px; }
  .fprog .bar { margin-top: 6px; }
  .fprog.complete { color: var(--ok); font-weight: 600; }
  ol.board { list-style: none; margin: 0; padding: 0; }
  ol.board li { display: grid; grid-template-columns: 40px minmax(0, 1fr) 80px 72px; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; }
  ol.board li.me { background: var(--accent-2); font-weight: 700; }
  ol.board .rk { font-size: 18px; text-align: center; }
  ol.board .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.board .xp { text-align: right; font-size: 13px; }
  .celebrate { text-align: center; }
  .celebrate .big-xp { font-size: 44px; font-weight: 800; color: var(--accent); animation: pop .6s ease; }
  .celebrate .lvlup { font-size: 16px; margin: 6px 0; }
  .new-badge { display: flex; gap: 10px; align-items: center; text-align: left; margin: 8px auto; padding: 8px 12px; border: 1px solid #f5b301; border-radius: 10px; max-width: 360px; }
  .new-badge .ic { font-size: 30px; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { .journey .node.current .dot, .celebrate .big-xp { animation: none; } .bar > span { transition: none; } }
  @media (max-width: 480px) { .journey .node { width: 84px; } ol.board li { grid-template-columns: 34px minmax(0, 1fr) 56px 64px; } }
  .hidden { display: none !important; }
  .loading { padding: 32px; text-align: center; color: var(--muted); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 10; }
  #toast.show { opacity: 1; }
  @media (max-width: 600px) { main { padding: 12px; } .kpi .value { font-size: 20px; } }
</style>
